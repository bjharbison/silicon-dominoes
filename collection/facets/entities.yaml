  tier1: [memorandum of understanding, MOU, letter of intent, communique, statement of intent, joint declaration]
  tier2: [framework agreement, feasibility study, pilot project, proof of concept, exploratory]
  tier3: [contract awarded, procurement award, signed agreement, tender won, supply agreement, purchase order]
  tier4: [financial close, financing closed, groundbreaking, construction begins, export license, loan facility, green loan, syndicated loan]
  tier5: [operational, went live, fully deployed, migration complete, refresh contract, expansion phase]
  reversal: [cancelled, terminated, suspended, banned, expelled, license denied, withdrawn, blacklisted, divested]

