# Silicon Dominoes — pilot feed set (Southeast Asia)
# Synced into the `feeds` table by every collector run (feeds is a mutable
# config table by design). Editing this file + rerunning a poller is how
# feeds are added, retired, or corrected.
#
# HONESTY NOTE: entries marked `unverified: true` are best-guess URLs that
# could not be network-verified when this file was written. That is fine:
# the feed-health monitor exists precisely to flag dead feeds on day one,
# and replacing a URL here is the fix. Expect to tune this file during the
# first week of operation.

pilot_scope:
  region: southeast_asia
  countries: [IDN, VNM, THA, MYS, PHL, SGP, KHM, LAO, MMR]

feeds:
  # ---- regional trade / technical press (S2-class sources) ----------------
  # RETIRED 2026-09-20 — unparseable on every poll since 2026-08-16 (syntax error at 2:0: the server does not return XML to the collector); alerted every 2h for a known condition. Reinstate only with a verified working URL. See STATUS.md.
#   - feed_id: rss-techwireasia
#     source_tier: S2
#     feed_class: rss
#     url: https://techwireasia.com/feed/
#     notes: Regional tech trade press; broad SEA coverage.

  # RETIRED 2026-09-20 — malformed XML on every poll since 2026-08-16 (mismatched tag at 239:2); alerted every 2h for a known condition. Reinstate only with a verified working URL. See STATUS.md.
#   - feed_id: rss-developingtelecoms
#     source_tier: S2
#     feed_class: rss
#     url: https://developingtelecoms.com/component/obrss/developing-telecoms.feed
#     unverified: true
#     notes: Telecom infrastructure in emerging markets; strong on RAN vendor awards.

  - feed_id: rss-datacenterdynamics
    source_tier: S2
    feed_class: rss
    url: https://www.datacenterdynamics.com/rss/
    unverified: true
    notes: DC builds, cloud regions, subsea cable landings — Facilities/Cloud layers.

  - feed_id: rss-lightreading
    source_tier: S2
    feed_class: rss
    url: https://www.lightreading.com/rss.xml
    unverified: true
    notes: Networks layer; vendor contract reporting.

  # RETIRED 2026-09-20 — every capture since 2026-08-16 was login-wall chrome (zero candidates, ever). From 2026-09-19 20:17 UTC e27.co accepted connections and never responded, hanging sd-rss for ~18h and blocking every other feed; reproduced 2026-09-20 14:08 UTC. See STATUS.md.
#   - feed_id: rss-e27
#     source_tier: S3
#     feed_class: rss
#     url: https://e27.co/feed/
#     unverified: true
#     notes: SEA tech ecosystem; Applications/Models layer signals.

  # ---- national / institutional (S1-class sources) ------------------------
  # RETIRED 2026-09-20 — URL is an HTML index page, not a feed (not well-formed at 6:24355 on every poll since 2026-08-16). Candidate for verify_items-style page-change detection instead of RSS. See STATUS.md.
#   - feed_id: rss-imda-sg
#     source_tier: S1
#     feed_class: rss
#     url: https://www.imda.gov.sg/rss-feeds
#     unverified: true
#     notes: Singapore IMDA press releases. If no RSS exists, replace with the
#       press-release index URL and let the page-change detector handle it.

  # RETIRED 2026-09-05 — items resolve to staging host emicweb.dev.cnnd.vn, no durable citations; Vietnamese-language work deprioritised. See STATUS.md.
#   - feed_id: rss-mic-vn
#     source_tier: S1
#     feed_class: rss
#     url: https://english.mic.gov.vn/rss/home.rss
#     unverified: true
#     notes: Vietnam Ministry of Information & Communications (English edition).

  # ---- structured news retrieval (GDELT DOC 2.0) --------------------------
  # Query is BUILT AT RUNTIME from the facet files (system prompt §3.2 —
  # synonyms are never hard-coded). One capture per run of the result set.
  # RETIRED 2026-09-05 — GDELT DOC API returns 429 indefinitely (no Retry-After); structured news retrieval not operational. See STATUS.md.
#   - feed_id: gdelt-sea-stack
#     source_tier: S3
#     feed_class: structured_news
#     url: https://api.gdeltproject.org/api/v2/doc/doc
#     gdelt:
#       facets: [actors, domains, geo_sea]
#       timespan: 1d
#       maxrecords: 100
#       max_terms_per_facet: 8

  # ---- gdelt-slow: one query per feeds.yaml entry, one request per timer
  # fire (collector/poll_gdelt.py) — NOT the faceted-runtime-query shape
  # above. `kind: gdelt` selects the poller; `feed_class: structured_news`
  # is unchanged, for the `feeds` table's DB column. `query` is a complete,
  # literal GDELT DOC 2.0 Boolean query string, written by hand (synonym
  # facets are not consulted for this poller — reusing them would reproduce
  # the multi-facet AND-of-ORs query the old gdelt-sea-stack shape built,
  # which is exactly the query shape suspected of tripping the sticky
  # throttle in the first place). `country_iso3` is optional, documentation-
  # only in this iteration (not compiled into `query` or `params`).
  # DISABLED pending collection/probe_gdelt.py's hand-run results — do not
  # enable until the throttle signatures in collector/fetcher.py have been
  # confirmed against a real response body.
  # OPERATING RULE: every new kind: gdelt query gets exactly one hand-run
  # `probe_gdelt.py --query 'TEXT'` check before it is ever uncommented
  # below — an unknown/text-error response costs a 24h GLOBAL cooldown
  # (every kind: gdelt query blocked, not just this one) plus a repeating
  # high-priority alert, so that is a far more expensive way to find out
  # a query's shape is wrong than one hand-run check first.
