<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silicon Dominoes — Global Showcase</title>
<!--
  Global showcase map (draft). Single file, no build step. Reads its data at runtime from
  showcase/data/*.json, showcase/queue.json and showcase/countries/<ISO3>.json, so it must
  be served over http(s) (GitHub Pages, or `python3 -m http.server` from the repo root).
  The "lean" colour is derived in the browser by the rule documented in showcase/README.md;
  it is never stored. Every record shown is an unreviewed draft.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root{
    --ground:#10141c; --panel:#171c26; --line:#2a3140;
    --ink:#d7dce6; --ink-dim:#8b93a5;
    --us:#3d6fd6; --us2:#6f92dd; --us3:#a9bdea;
    --prc:#c0392f; --prc2:#cf6a5d; --prc3:#e2a39b;
    --sov:#8a6fd1; --hedge:#e5a53c; --mixed:#9aa3b5; --nodata:#1c222e;
    --warn:#e5a53c; --ok:#57b98a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ground);color:var(--ink);font-family:'IBM Plex Mono',ui-monospace,monospace;
    font-size:13px;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
  header h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:.14em;text-transform:uppercase}
  header h1 small{color:var(--ink-dim);font-weight:500;letter-spacing:.08em;margin-left:8px;font-size:12px}
  .stamp{margin-left:auto;border:1px solid var(--warn);color:var(--warn);padding:3px 9px;font-size:10px;
    letter-spacing:.08em;text-transform:uppercase;transform:rotate(-1deg);white-space:nowrap}
  #banner{background:repeating-linear-gradient(45deg,#3a2f14,#3a2f14 12px,#443716 12px,#443716 24px);
    color:var(--warn);border-bottom:1px solid #5c4b1e;padding:6px 16px;font-size:11px;letter-spacing:.04em;line-height:1.5}
  nav{display:flex;flex-wrap:wrap;gap:2px;padding:8px 16px;border-bottom:1px solid var(--line)}
  nav button{background:none;border:1px solid var(--line);color:var(--ink-dim);font:inherit;font-size:11px;
    letter-spacing:.06em;padding:5px 11px;cursor:pointer;text-transform:uppercase}
  nav button.active{color:var(--ink);border-color:var(--ink-dim);background:var(--panel)}
  nav button:focus-visible{outline:1px solid var(--ink)}
  main{flex:1;display:flex;min-height:0}
  #mapwrap{flex:1;min-width:0;position:relative}
  #map{width:100%;height:100%;display:block;cursor:grab}
  .country{stroke:var(--ground);stroke-width:.4}
  .country:hover{opacity:.82;cursor:pointer}
  .country.selected{stroke:#fff;stroke-width:1.2}
  #legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);
    padding:9px 11px;font-size:10px;line-height:1.7;z-index:3;max-width:260px}
  #legend .title{color:var(--ink-dim);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
  #legend .row{display:flex;align-items:center;gap:7px}
  #legend .sw{width:16px;height:11px;border:1px solid var(--line);flex:none}
  #legend .count{margin-left:auto;color:var(--ink-dim);padding-left:10px}
  #legend .cap{color:var(--ink-dim);margin-top:5px;line-height:1.45}
  aside{width:400px;flex:none;border-left:1px solid var(--line);overflow-y:auto;padding:16px;background:var(--panel)}
  aside h2{font-family:'Space Grotesk',sans-serif;font-size:18px;margin-bottom:2px}
  aside h3{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);font-weight:500;margin:16px 0 6px}
  .dim{color:var(--ink-dim)}
  .badge{display:inline-block;border:1px solid var(--warn);color:var(--warn);font-size:9.5px;letter-spacing:.08em;

  .badge.grey{border-color:var(--line);color:var(--ink-dim)}
  .kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:12px;line-height:1.45}

  .leanbar{display:flex;height:12px;border:1px solid var(--line);margin:6px 0 3px;background:var(--nodata)}
  .leanbar span{display:block;height:100%}
  .ev{font-size:11px;color:var(--ink-dim);line-height:1.55}
  .finding{border:1px solid var(--line);padding:8px 9px;margin-bottom:8px;background:var(--ground);line-height:1.5}
  .finding .top{display:flex;gap:6px;flex-wrap:wrap;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
  .pill{border:1px solid var(--line);padding:0 5px}
  .pill.us{border-color:var(--us);color:var(--us2)} .pill.prc{border-color:var(--prc);color:var(--prc2)}
  .pill.third,.pill.domestic{border-color:var(--sov);color:var(--sov)} .pill.rev{border-color:var(--warn);color:var(--warn)}
  .srcs{font-size:10.5px;margin-top:4px}
  a{color:#8fb0f0} a:visited{color:#a99ad9}
  ul.plain{list-style:none} ul.plain li{margin-bottom:4px;font-size:11.5px;line-height:1.5}
  #tooltip{position:fixed;pointer-events:none;display:none;z-index:9;background:var(--panel);border:1px solid var(--line);
    padding:6px 9px;font-size:11px;max-width:260px;line-height:1.5}
  footer{border-top:1px solid var(--line);padding:6px 16px;font-size:10.5px;color:var(--ink-dim);display:flex;gap:16px;flex-wrap:wrap}
  /* ---- simple / advanced mode ---- */
  #modeToggle{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
  #modeToggle button{background:none;border:none;color:var(--ink-dim);font:inherit;font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;cursor:pointer}
  #modeToggle button.active{color:var(--ground);background:var(--ink-dim)}
  #modeToggle button:focus-visible{outline:1px solid var(--ink)}
  #mapwrap[hidden],#cardsview[hidden]{display:none}
  #cardsview{flex:1;min-width:0;min-height:0;overflow-y:auto;padding:16px}
  #cardsearch{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);color:var(--ink);
    font:inherit;font-size:12px;padding:7px 9px}
  .grp{font-family:'Space Grotesk',sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--ink-dim);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
  .grp .sw{width:14px;height:10px;border:1px solid var(--line);flex:none}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px;cursor:pointer}
  .scard:hover,.scard:focus-visible{border-color:var(--ink-dim);outline:none}
  .scard h4{font-family:'Space Grotesk',sans-serif;font-size:14px;margin-bottom:4px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chips button{background:repeating-linear-gradient(45deg,#242b38,#242b38 6px,#1c222e 6px,#1c222e 12px);
    border:1px solid var(--line);color:var(--ink);font:inherit;font-size:11px;padding:4px 8px;cursor:pointer;border-radius:3px}
  .pchip{display:inline-block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ground);
    border-radius:3px;padding:2px 7px;font-weight:600}
  .pchip.hatch{background:repeating-linear-gradient(45deg,#2a3140,#2a3140 4px,#3a4356 4px,#3a4356 8px);color:var(--ink)}
  .s-sent{font-size:12.5px;line-height:1.65;margin:9px 0}
  .scard .s-sent{font-size:12px;margin:0}
  .sbarrow{display:flex;align-items:center;gap:8px;margin:4px 0}
  .sbl{width:86px;color:var(--ink-dim);font-size:10.5px;text-align:right;flex:none}
  .sbar{flex:1;height:9px;background:var(--nodata);border-radius:2px;overflow:hidden}
  .sbar>div{height:100%}
  .sbv{width:34px;font-size:11px;flex:none}
  ul.onfile{list-style:none}
  ul.onfile li{font-size:11.5px;line-height:1.5;margin-bottom:5px;padding-left:15px;position:relative}
  ul.onfile li::before{content:"";position:absolute;left:0;top:.42em;width:8px;height:8px;border-radius:50%;
    background:var(--dot);border:2px solid var(--dot);box-sizing:border-box}
  ul.onfile li.neg::before{background:none}
  .note{color:var(--ink-dim);font-size:11px;line-height:1.55;margin-top:6px}
  .fullrec{margin-top:14px;background:none;border:1px solid var(--ink-dim);color:var(--ink);font:inherit;font-size:10.5px;
    letter-spacing:.1em;text-transform:uppercase;padding:7px 12px;cursor:pointer;width:100%}
  .fullrec:hover{background:var(--ground)}
  /* Phones: the whole page scrolls (as in map.html v5.1) instead of squeezing map, panel and
     footer into one fixed-height screen, where the footer was drawn over the panel; the legend
     sits below the map instead of covering half of it. */
  @media (max-width:820px){
    html,body{height:auto} body{min-height:100%}
    main{flex-direction:column;flex:none}
    #mapwrap{flex:none}
    #map{height:56vw;min-height:200px;max-height:60vh;touch-action:pan-y} /* world map is ~2:1 */
    #legend{position:static;margin:8px 12px;max-width:none}
    aside{width:auto;border-left:none;border-top:1px solid var(--line);overflow-y:visible}
    .stamp{margin-left:0}
    #cardsview{overflow-y:visible;padding:12px} .cards{grid-template-columns:1fr}
    body.cardsmode aside{display:none}
  }
</style>

<body>
<header>
  <h1>Silicon Dominoes<small>global showcase</small></h1>
  <div id="modeToggle" role="group" aria-label="Detail level" title="Simple: plain-language summaries generated from the data. Advanced: the full evidence record.">
    <button data-mode="simple">Simple</button><button data-mode="advanced">Advanced</button>
  </div>
  <span class="stamp">Draft · unreviewed</span>
</header>
<div id="banner"><b>DRAFT.</b> Every value on this page is a Claude-drafted coding from public sources, not yet audited.
The default colour is a mechanical rule over those codings (see showcase/README.md), not a DEPTH-N score.</div>
<nav id="views"></nav>
<main>
  <div id="mapwrap">
    <svg id="map" role="img" aria-label="World map"></svg>
    <div id="legend"></div>
  </div>
  <section id="cardsview" hidden aria-label="Country list"></section>
  <aside id="panel"><p class="dim">Loading data…</p></aside>
</main>
<footer><span id="status">loading</span><span id="stamp"></span></footer>
<div id="tooltip"></div>
<script>
"use strict";
const GEO_URL="https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson";
const FILES={dip:"data/diplomatic_alignment.json",usc:"data/us_cloud_regions.json",prcc:"data/prc_cloud_regions.json",
  rest:"data/prc_model_restrictions.json",chip:"data/us_chip_export_posture.json",names:"data/country_names.json",queue:"queue.json"};
const TIER_W={1:.15,2:.35,3:.70,4:.85,5:1.0};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?esc(u):"#";
let D={}, REC=new Map(), GEO=null, selected=null, view="lean", uiMode="simple", drawnW=0;

/* ---------------- plain-language lexicon (Simple mode) ----------------
   Every Simple-mode sentence about a country is assembled mechanically from this object plus
   the data; there is no hand-written text about any country anywhere on the page. A wording
   change edits this object and bumps its version, which is stamped in the footer. */
const LEX={version:"0.1",
  cell:{
    pole_us:{legend:"Home of the US stack",sent:"is the home of the US technology stack, the reference point the map measures against"},
    pole_prc:{legend:"Home of China's stack",sent:"is the home of China's technology stack, the reference point the map measures against"},
    lean_us:{legend:"Leans US",sent:"leans toward the US technology stack"},
    lean_prc:{legend:"Leans China",sent:"leans toward China's technology stack"},
    lean_sov:{legend:"Own or other suppliers",sent:"leans toward its own technology or suppliers outside the US and China"},
    contested:{legend:"Takes from both",sent:"is taking substantial technology from both the US and China"},
    mixed:{legend:"Mixed",sent:"has a mixed record, with no single side clearly ahead"},
    insufficient:{legend:"Not enough evidence yet",sent:"does not have enough sourced evidence yet to say which way it leans"}},
  pole_adj:{us:"American",prc:"Chinese",domestic:"home-grown",third:"non-US, non-Chinese"},
  pole_name:{us:"US",prc:"China",sov:"Own or other"},
  layer_nouns:{power:"electricity supply",facilities:"data centers",silicon:"chips",networks:"telecom networks",
    cloud:"cloud services",models:"AI models",applications:"apps and services"},
  tier:{1:"announced plans for {x}",2:"a pilot or framework deal for {x}",3:"a signed contract for {x}",
    4:"financed or under-construction {x}",5:"operating {x}"},
  reversal:"a step back from {x}",
  mods:{municipal:" at city level",old:" (before 2020)"},
  global:{pax:"membership in the US-led Pax Silica group",waico:"membership in China's WAICO group",
    usc_live:"American cloud data centers operating in the country",usc_ann:"announced American cloud data centers",
    prcc_live:"Chinese cloud data centers operating in the country",prcc_ann:"announced Chinese cloud data centers",
    block:"a national ban on Chinese AI models",limit:"official limits on Chinese AI models"},
  signals_one:"The strongest signal is {a}.",
  signals_two:"The strongest signals are {a} and {b}.",
  traj:{talk:"Most of this evidence is announcements, not signed deals.",
    done:"Most of this evidence is signed contracts and working projects, not just talk.",
    mix:"The evidence is a mix of announcements and signed deals."},
  pending:"Only the global source lists have been checked so far; the country-by-country review has not reached it yet.",
  coded_one:"Based on 1 finding from the country-by-country review plus the global source lists.",
  coded:"Based on {n} findings from the country-by-country review plus the global source lists.",
  coded_zero:"The country-by-country review found nothing beyond the global source lists.",
  bars_title:"How the evidence divides",
  bars_note:"Each bar is that side's share of the evidence found so far. A short record can swing on a single item.",
  onfile_title:"What counts",
  dots_note:"Filled dot: pulls toward that side. Hollow dot: pulls away from it.",
  status:{unreviewed:"Drafted by Claude from public sources; not yet reviewed by a person.",
    audited:"Drafted and checked by Claude from public sources; not yet reviewed by a person.",
    pending:"Not yet reached by the country-by-country review."},
  full_record:"Show full record \u2192 Advanced",
  nav:{map:"Map",cards:"Country list"},
  cap:"Colour shows which stack each country's evidence leans toward. Striped means not enough evidence yet, never balanced.",
  search:"Find a country",
  cards_intro:"Grouped by which way the evidence leans. Tap a country to open it on the map.",
  ov:{title:"Which way is each country leaning?",
    lede:"Each country is coloured by which AI technology stack its evidence leans toward: American, Chinese, or its own and other suppliers. Every sentence about a country is generated from its data; none is written by hand.",
    progress:"{d} of {t} countries reviewed one by one so far; the rest rely on global source lists only.",
    howto:["Tap a country to see why it is coloured that way.","Country list shows every country with a short summary.",
      "Striped means not enough evidence yet, never balanced.","Advanced (top right) shows every source and the full working.",
      "Everything here is an unreviewed draft."]}};
const fill=(s,o)=>s.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m);
const cap1=s=>s.charAt(0).toUpperCase()+s.slice(1);
function plainFinding(f,old){
  const x=(LEX.pole_adj[f.pole]||"")+" "+(LEX.layer_nouns[f.layer]||f.layer);
  let p=f.reversal?fill(LEX.reversal,{x}):fill(LEX.tier[f.instrument_tier]||"{x}",{x});
  if(f.scale==="municipal") p+=LEX.mods.municipal;
  if(old) p+=LEX.mods.old;
  return p;
}

/* ---------------- derived lean (rule: showcase/README.md) ---------------- */
function lean(iso){
  const ev=[]; // {pole, w, label, capped}
  const add=(pole,w,label,lowTier,plain)=>ev.push({pole,w,label,lowTier:!!lowTier,plain:plain||null});
  const dip=D.dip&&D.dip.countries[iso];
  if(dip){
    if(dip.pax_silica&&["signatory","convener","non_signatory_participant"].includes(dip.pax_silica.status)) add("us",.15,"Pax Silica",true,LEX.global.pax);
    if(dip.waico&&["founding","acceded","convener"].includes(dip.waico.status)) add("prc",.15,"WAICO",true,LEX.global.waico);
  }
  const uc=D.usc&&D.usc.countries[iso];
  if(uc){const st=["aws","azure","gcp"].map(p=>uc[p]&&uc[p].status);
    if(st.includes("ga")) add("us",1,"US hyperscaler region live",false,LEX.global.usc_live);
    else if(st.includes("announced")) add("us",.35,"US hyperscaler region announced",true,LEX.global.usc_ann);}
  const pc=D.prcc&&D.prcc.countries[iso];
  if(pc){const st=["alibaba","huawei","tencent"].map(p=>pc[p]&&pc[p].status);
    if(st.includes("live")) add("prc",1,"PRC cloud region live",false,LEX.global.prcc_live);
    else if(st.includes("announced")) add("prc",.35,"PRC cloud region announced",true,LEX.global.prcc_ann);}
  const rs=D.rest&&D.rest.countries[iso];
  if(rs&&rs.actions){const live=rs.actions.filter(a=>a.current_status==="in_force");
    if(live.some(a=>a.scope==="national_block")) add("prc",-.70,"PRC-model national block",false,LEX.global.block);
    else if(live.length) add("prc",-.35,"PRC-model restriction ("+live.map(a=>a.scope).join(", ")+")",false,LEX.global.limit);}
  const rec=REC.get(iso);
  if(rec) for(const f of rec.findings||[]){
    if(!f.pole) continue;
    // lean rule v0.2 (showcase/README.md): only geopolitical/sanctions reversals move the map;
    // municipal findings and unconfirmed pre-2020 findings count half; confirmed-ended count zero.
    if(f.reversal&&!["geopolitical","sanctions"].includes(f.reversal_reason)) continue;
    if(!f.reversal&&f.still_current===false) continue;
    let w=TIER_W[f.instrument_tier]||0; if(f.confidence==="low") w/=2;
    if(f.scale==="municipal") w/=2;
    const old=!f.reversal&&f.date&&String(f.date).slice(0,4)<"2020"&&f.still_current!==true; if(old) w/=2;
    if(f.reversal) w=-w;
    add(f.pole==="domestic"||f.pole==="third"?"sov":f.pole,w,f.id+" "+f.layer+(f.reversal?" (reversal)":"")+(f.scale==="municipal"?" (municipal)":"")+(old?" (pre-2020)":""),!f.reversal&&f.instrument_tier<=2,plainFinding(f,old));
  }

  const tot={us:0,prc:0,sov:0}, low={us:0,prc:0,sov:0};
  for(const e of ev){
    if(e.lowTier&&e.w>0){const room=Math.max(0,.30-low[e.pole]);const used=Math.min(room,e.w);low[e.pole]+=used;tot[e.pole]+=used;e.capped=used<e.w}
    else tot[e.pole]+=e.w;
  }
  for(const k in tot) tot[k]=Math.max(0,tot[k]);
  const sum=tot.us+tot.prc+tot.sov;
  let cell;
  if(sum<.70) cell="insufficient";
  else if(tot.us>=.3*sum&&tot.prc>=.3*sum) cell="contested";
  else{const top=Object.entries(tot).sort((a,b)=>b[1]-a[1])[0]; cell=top[1]>=.5*sum?"lean_"+top[0]:"mixed";}
  // The two poles are the reference points, not swing states: hosting the other side's
  // cloud regions would otherwise read the US as 'contested' and China as 'insufficient'.
  if(iso==="USA") cell="pole_us"; else if(iso==="CHN") cell="pole_prc";
  return {cell,tot,sum,ev};
}

/* ---------------- views ---------------- */
const VIEWS={
  lean:{label:"Stack lean (derived)",cap:"Mechanical rule over all layers and desk-pass findings. Hatched = insufficient data, never neutral.",
    cats:{pole_us:["US (pole)","--us"],pole_prc:["China (pole)","--prc"],lean_us:["Leans US","--us2"],lean_prc:["Leans PRC","--prc2"],lean_sov:["Leans sovereign / third","--sov"],
      contested:["Contested (US and PRC both ≥30%)","--hedge"],mixed:["Mixed","--mixed"],insufficient:["Insufficient data","hatch"]},
    of:iso=>lean(iso).cell},
  blocs:{label:"Blocs",cap:"Tier-1 instrument: what governments signed. Observers and invitations do not count.",
    cats:{us:["Pax Silica","--us"],prc:["WAICO","--prc"],hedge:["Both (hedge)","--hedge"],insufficient:["Neither / unconfirmed","hatch"]},
    of:iso=>{const r=D.dip&&D.dip.countries[iso];return r?r.cell:"insufficient"}},
  usc:{label:"US cloud",cap:"Generally available AWS / Azure / Google Cloud public regions in-country.",
    cats:{g3:["3 providers live","--us"],g2:["2 providers live","--us2"],g1:["1 provider live","--us3"],ann:["Announced only","--mixed"],
      partner:["Partner-operated (China)","--prc3"],none:["None","--nodata"]},
    of:iso=>{const r=D.usc&&D.usc.countries[iso];if(!r)return "none";const st=["aws","azure","gcp"].map(p=>r[p]&&r[p].status);
      const n=st.filter(s=>s==="ga").length;if(n)return "g"+n;if(st.includes("announced"))return "ann";if(st.includes("partner_operated"))return "partner";return "none"}},
  prcc:{label:"PRC cloud",cap:"Live Alibaba / Huawei / Tencent Cloud regions outside mainland China (secondary sources only).",
    cats:{home:["Home market","--prc"],g3:["3 providers live","--prc"],g2:["2 providers live","--prc2"],g1:["1 provider live","--prc3"],
      ann:["Announced only","--mixed"],closed:["Closed only","--hedge"],none:["None","--nodata"]},
    of:iso=>{if(iso==="CHN")return "home";const r=D.prcc&&D.prcc.countries[iso];if(!r)return "none";const st=["alibaba","huawei","tencent"].map(p=>r[p]&&r[p].status);
      const n=st.filter(s=>s==="live").length;if(n)return "g"+n;if(st.includes("announced"))return "ann";if(st.includes("closed"))return "closed";return "none"}},
  rest:{label:"PRC-model limits",cap:"National government restrictions on DeepSeek and other PRC models, in force.",
    cats:{national_block:["National block / app removal","--us"],download_suspension:["Download suspension","--us2"],government_devices:["Government devices / sector","--us3"],
      lifted:["Lifted","--hedge"],none:["None found","--nodata"]},
    of:iso=>{const r=D.rest&&D.rest.countries[iso];if(!r||!r.actions)return "none";const live=r.actions.filter(a=>a.current_status==="in_force").map(a=>a.scope);
      for(const s of ["national_block","download_suspension"]) if(live.includes(s)) return s;
      if(live.some(s=>s==="government_devices"||s==="sector"))return "government_devices";
      if(r.actions.some(a=>a.current_status==="lifted"||a.scope==="lifted"))return "lifted";return "none"}},
  chip:{label:"US chip export",cap:"US licence posture for advanced AI chips (a US decision about the country; not in the lean).",
    cats:{embargoed:["Embargoed","--prc"],license_presumption_denial:["Presumption of denial","--prc2"],license_required:["Licence required","--hedge"],
      special:["Special arrangement","--sov"],no_license_required_general:["No licence (default)","--us3"]},
    of:iso=>{const c=D.chip;if(!c)return null;const r=c.countries&&c.countries[iso];if(!r)return (c.default&&c.default.code)||null;
      if(r.special_arrangement&&r.code==="license_required")return "special";return r.code}},
  coverage:{label:"Desk pass",cap:"Countries coded by the daily desk pass so far (all unreviewed).",
    cats:{many:["Coded, 4+ findings","--ok"],some:["Coded, 1–3 findings","--us3"],zero:["Coded, nothing found","--mixed"],pending:["Pending","hatch"]},
    of:iso=>{const r=REC.get(iso);if(!r)return "pending";const n=(r.findings||[]).length;return n>=4?"many":n?"some":"zero"}}
};

/* ---------------- map ---------------- */
const svg=d3.select("#map"), gRoot=svg.append("g");
const defs=svg.append("defs");
const pat=defs.append("pattern").attr("id","hatch").attr("patternUnits","userSpaceOnUse").attr("width",6).attr("height",6).attr("patternTransform","rotate(45)");
pat.append("rect").attr("width",6).attr("height",6).attr("fill","#1c222e");
pat.append("line").attr("x1",0).attr("y1",0).attr("x2",0).attr("y2",6).attr("stroke","#3a4356").attr("stroke-width",2);
const fillFor=c=>c==="hatch"?"url(#hatch)":css(c);
function isoOf(f){const p=f.properties||{};let id=f.id||p.iso_a3||p.ISO_A3||p.adm0_a3;
  if(!id||id==="-99"){const nm=(p.name||"").toLowerCase();if(nm.includes("kosovo"))id="XKX";else if(nm==="france")id="FRA";else if(nm==="norway")id="NOR";}
  return id;}
function drawMap(){
  // Measure the map itself, not #mapwrap: on phones the legend sits inside #mapwrap below the map.
  const box=document.getElementById("map").getBoundingClientRect();
  if(box.width<10||box.height<10) return; // hidden (country list showing): redraw when shown
  drawnW=box.width;
  svg.attr("viewBox",`0 0 ${box.width} ${box.height}`);
  const proj=d3.geoNaturalEarth1().fitExtent([[8,8],[box.width-8,box.height-8]],{type:"Sphere"});
  const path=d3.geoPath(proj);
  gRoot.selectAll("path.country").data(GEO.features,isoOf).join("path").attr("class","country").attr("d",path)
    .on("mousemove",(e,f)=>{const iso=isoOf(f);const tt=document.getElementById("tooltip");
      const v=VIEWS[mapView()],c=v.of(iso),lab=catLabel(mapView(),c);
      tt.innerHTML=`<b>${esc(nameOf(iso,f))}</b><br><span class="dim">${esc(v.label)}:</span> ${esc(lab)}${REC.has(iso)?('<br><span class="dim">desk pass: '+(REC.get(iso).review_status==='unreviewed'?'unreviewed draft':esc(REC.get(iso).review_status))+'</span>'):""}`;
      tt.style.display="block";tt.style.left=(e.clientX+12)+"px";tt.style.top=(e.clientY+12)+"px";})
    .on("mouseleave",()=>{document.getElementById("tooltip").style.display="none"})
    .on("click",(e,f)=>select(isoOf(f),f));
  svg.call(d3.zoom().scaleExtent([1,8]).on("zoom",e=>gRoot.attr("transform",e.transform)));
  recolor();
}
function nameOf(iso,f){return (D.names&&D.names[iso])||(f&&f.properties&&f.properties.name)||iso}
function recolor(){
  const v=VIEWS[mapView()], counts={};
  gRoot.selectAll("path.country").attr("fill",f=>{const c=v.of(isoOf(f));counts[c]=(counts[c]||0)+1;return v.cats[c]?fillFor(v.cats[c][1]):css("--nodata")})
    .classed("selected",f=>isoOf(f)===selected);
  document.getElementById("legend").innerHTML=`<div class="title">${esc(uiMode==="simple"?LEX.nav.map:v.label)}</div>`+
    Object.entries(v.cats).map(([k,[lab,col]])=>`<div class="row"><span class="sw" style="background:${swatch(col)}"></span>${esc(catLabel(mapView(),k))}<span class="count">${counts[k]||0}</span></div>`).join("")+
    `<div class="cap">${esc(uiMode==="simple"?LEX.cap:v.cap)}</div>`;
}
const mapView=()=>view==="cards"?"lean":view;
const swatch=col=>col==="hatch"?"repeating-linear-gradient(45deg,#1c222e,#1c222e 3px,#3a4356 3px,#3a4356 5px)":css(col);
function catLabel(vk,k){
  if(uiMode==="simple"&&vk==="lean"&&LEX.cell[k]) return LEX.cell[k].legend;
  const c=VIEWS[vk].cats[k]; return c?c[0]:"\u2014";
}
function buildNav(){
  const nav=document.getElementById("views");
  if(uiMode==="simple"&&view!=="cards") view="lean";
  if(uiMode==="advanced"&&view==="cards") view="lean";
  const items=uiMode==="simple"?[["lean",LEX.nav.map],["cards",LEX.nav.cards]]:Object.entries(VIEWS).map(([k,v])=>[k,v.label]);
  nav.innerHTML=items.map(([k,l])=>`<button data-v="${k}" class="${k===view?"active":""}">${esc(l)}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>setView(b.dataset.v));
  showPane();
}
function setView(v){
  view=v; document.querySelectorAll("#views button").forEach(x=>x.classList.toggle("active",x.dataset.v===v));
  showPane(); if(v==="cards") renderCards(); else recolor();
}
function showPane(){
  const cards=view==="cards", wrap=document.getElementById("mapwrap");
  wrap.hidden=cards; document.getElementById("cardsview").hidden=!cards;
  document.body.classList.toggle("cardsmode",cards);
  if(!cards&&GEO&&wrap.getBoundingClientRect().width!==drawnW) drawMap();
}

/* ---------------- panel ---------------- */
const srcLinks=s=>(s||[]).map(x=>`<a href="${safeUrl(x.url)}" target="_blank" rel="noopener">${esc(x.publisher||hostOf(x.url))}</a> <span class="dim">${esc(x.source_tier||"")}${x.date?" · "+esc(x.date):""}</span>`).join(" · ");
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch(e){return "link"}};
function select(iso,f){
  selected=iso; recolor();
  if(uiMode==="simple"){simplePanel(iso,f);return;}
  const L=lean(iso), rec=REC.get(iso), P=document.getElementById("panel");
  const pct=k=>L.sum?(100*L.tot[k]/L.sum):0;
  let h=`<h2>${esc(nameOf(iso,f))}</h2><span class="dim">${esc(iso)}</span><div>`+
    (rec?`<span class="badge">desk pass · ${esc(rec.review_status==='audited'?'Claude-audited, not yet reviewed':rec.review_status)}</span>`:`<span class="badge grey">desk pass pending</span>`)+`</div>`;
  h+=`<h3>Stack lean (derived)</h3><div>${esc(VIEWS.lean.cats[L.cell][0])}</div>
    <div class="leanbar"><span style="width:${pct("us")}%;background:var(--us)"></span><span style="width:${pct("sov")}%;background:var(--sov)"></span><span style="width:${pct("prc")}%;background:var(--prc)"></span></div>
    <div class="ev">US ${L.tot.us.toFixed(2)} · sovereign/third ${L.tot.sov.toFixed(2)} · PRC ${L.tot.prc.toFixed(2)}</div>
    <div class="ev">${L.ev.map(e=>`${e.w>0?"+":""}${e.w.toFixed(2)} ${e.pole.toUpperCase()} — ${esc(e.label)}${e.capped?" (capped)":""}`).join("<br>")||"no evidence yet"}</div>`;
  h+=`<h3>Global layers</h3><div class="kv">`;
  const dip=D.dip&&D.dip.countries[iso];
  const bl=x=>x?`${esc(x.status)}${x.date?" · "+esc(x.date):""}${x.confidence==="low"?' <span class="dim">(low confidence)</span>':""}<div class="srcs">${srcLinks(x.sources)}</div>`:'<span class="dim">—</span>';
  h+=`<span class="k">Pax Silica</span><span>${bl(dip&&dip.pax_silica)}</span><span class="k">WAICO</span><span>${bl(dip&&dip.waico)}</span>`;
  const uc=D.usc&&D.usc.countries[iso];
  h+=`<span class="k">US cloud</span><span>${uc?["aws","azure","gcp"].filter(p=>uc[p]).map(p=>`${p.toUpperCase()}: ${esc(uc[p].status)}${uc[p].regions?" ("+esc(uc[p].regions.join(", "))+")":""}`).join("<br>")+`<div class="srcs">${srcLinks(uc.sources)}</div>`:'<span class="dim">none found</span>'}</span>`;
  const pc=D.prcc&&D.prcc.countries[iso];
  h+=`<span class="k">PRC cloud</span><span>${pc?["alibaba","huawei","tencent"].filter(p=>pc[p]).map(p=>`${p}: ${esc(pc[p].status)}${pc[p].since?" · since "+esc(pc[p].since):""}`).join("<br>")+`<div class="srcs">${srcLinks(pc.sources)}</div>`:'<span class="dim">none found</span>'}</span>`;
  const rs=D.rest&&D.rest.countries[iso];
  h+=`<span class="k">PRC-model limits</span><span>${rs&&rs.actions?rs.actions.map(a=>`${esc(a.date||"")} ${esc(a.scope)} — ${esc(a.current_status)}: ${esc(a.summary||"")}<div class="srcs">${srcLinks(a.sources)}</div>`).join(""):'<span class="dim">none found</span>'}</span>`;
  const ch=D.chip&&D.chip.countries&&D.chip.countries[iso];
  h+=`<span class="k">US chip export</span><span>${ch?`${esc(ch.code)}${ch.country_groups?" · "+esc(ch.country_groups.join(", ")):""}${ch.special_arrangement?"<br>"+esc(typeof ch.special_arrangement==="string"?ch.special_arrangement:(ch.special_arrangement.description||JSON.stringify(ch.special_arrangement))):""}<div class="srcs">${srcLinks(ch.sources)}</div>`:(D.chip&&D.chip.default?esc(D.chip.default.code)+' <span class="dim">(default)</span>':'<span class="dim">—</span>')}</span></div>`;
  if(rec){
    h+=`<h3>Desk-pass findings (${(rec.findings||[]).length})</h3>`;
    h+=(rec.findings||[]).map(x=>`<div class="finding"><div class="top"><span class="pill">${esc(x.layer)}</span><span class="pill ${esc(x.pole||"")}">${esc(x.pole||"pole unclear")}</span><span class="pill">T${esc(x.instrument_tier)}</span>${x.reversal?'<span class="pill rev">reversal</span>':""}<span class="dim">${esc(x.date||"")} · ${esc(x.confidence)}${x.corroborated?" · corroborated":""}</span></div>
      <div>${esc(x.summary)}</div>${x.controller||x.local_actor?`<div class="dim" style="font-size:11px">${esc(x.controller||"?")} → ${esc(x.local_actor||"")}</div>`:""}
      ${x.analyst_inference?`<div class="dim" style="font-size:11px">analyst inference: ${esc(x.analyst_inference)}</div>`:""}
      <div class="srcs">${srcLinks(x.sources)}</div></div>`).join("")||'<p class="dim">No findings: see layer notes.</p>';
    h+=`<h3>Layers searched</h3><ul class="plain">`+Object.entries(rec.layers_searched||{}).map(([k,v])=>`<li><b>${esc(k)}</b>: ${esc(v.result)}${v.null_reason?' <span class="dim">— '+esc(v.null_reason)+"</span>":""}</li>`).join("")+`</ul>`;
    if((rec.research_gaps||[]).length) h+=`<h3>Open questions</h3><ul class="plain">`+rec.research_gaps.map(g=>`<li>${esc(g)}</li>`).join("")+`</ul>`;
    h+=`<p class="dim" style="margin-top:10px;font-size:10.5px">coded ${esc(rec.coded_at)} · spec ${esc(rec.spec_version)} · ${esc(rec.searches_run)} searches</p>`;
  }
  P.innerHTML=h;
}
function overview(){
  if(uiMode==="simple"){simpleOverview();return;}
  const q=D.queue||{pending:[],done:[]};
  const done=q.done.length,total=done+q.pending.length;
  document.getElementById("panel").innerHTML=`<h2>Global showcase</h2><p class="dim" style="line-height:1.55;margin-top:6px">Which AI technology stack is each country building on? Five global layers from public source lists, plus a country-by-country desk pass running ten countries a day.</p>
    <h3>Progress</h3><div>${done} of ${total} countries desk-passed</div>
    <h3>How to read it</h3><ul class="plain"><li>Tap a country for its evidence and sources.</li><li>The buttons above switch layers. "Stack lean" combines them by a fixed rule; the others are single sources.</li><li>Hatched means not enough evidence, never "balanced".</li><li>Every value is an unreviewed draft.</li></ul>`;
}

/* ---------------- simple mode ---------------- */
function simpleSentences(iso,name){
  const L=lean(iso), rec=REC.get(iso), out=[name+" "+LEX.cell[L.cell].sent+"."];
  const sig=[], seen=new Set();
  L.ev.filter(e=>e.plain&&e.w!==0).sort((a,b)=>Math.abs(b.w)-Math.abs(a.w))
    .forEach(e=>{if(sig.length<2&&!seen.has(e.plain)){seen.add(e.plain);sig.push(e.plain)}});
  if(sig.length===1) out.push(fill(LEX.signals_one,{a:sig[0]}));
  if(sig.length===2) out.push(fill(LEX.signals_two,{a:sig[0],b:sig[1]}));
  let talk=0,done=0; for(const e of L.ev){if(e.w<=0)continue; if(e.lowTier)talk+=e.w; else done+=e.w}
  const tt=talk+done; if(tt>0) out.push(talk/tt>=.65?LEX.traj.talk:done/tt>=.65?LEX.traj.done:LEX.traj.mix);
  if(!rec) out.push(LEX.pending);
  else{const n=(rec.findings||[]).length; out.push(n===0?LEX.coded_zero:n===1?LEX.coded_one:fill(LEX.coded,{n:String(n)}));}
  return {L,text:out.join(" ")};
}
function cellChip(cell){
  const col=VIEWS.lean.cats[cell][1];
  return col==="hatch"?`<span class="pchip hatch">${esc(LEX.cell[cell].legend)}</span>`
    :`<span class="pchip" style="background:${css(col)}">${esc(LEX.cell[cell].legend)}</span>`;
}
const sbar=(lbl,v,col)=>`<div class="sbarrow"><span class="sbl">${esc(lbl)}</span><div class="sbar"><div style="width:${Math.max(0,Math.min(100,v))}%;background:${col}"></div></div><span class="sbv">${v}%</span></div>`;
const dotCol=p=>p==="us"?"var(--us)":p==="prc"?"var(--prc)":"var(--sov)";
function simplePanel(iso,f){
  const name=nameOf(iso,f), S=simpleSentences(iso,name), L=S.L, rec=REC.get(iso);
  const pct=k=>L.sum?Math.round(100*L.tot[k]/L.sum):0;
  let h=`<h2>${esc(name)}</h2><div style="margin-top:6px">${cellChip(L.cell)}</div><div class="s-sent">${esc(S.text)}</div>`;
  if(L.sum>0) h+=`<h3>${esc(LEX.bars_title)}</h3>`+sbar(LEX.pole_name.us,pct("us"),"var(--us)")+
    sbar(LEX.pole_name.sov,pct("sov"),"var(--sov)")+sbar(LEX.pole_name.prc,pct("prc"),"var(--prc)")+`<div class="note">${esc(LEX.bars_note)}</div>`;
  // Identical phrases merge into one line with a count; strongest first.
  const grp=new Map();
  for(const e of L.ev){if(!e.plain||e.w===0)continue;const k=e.pole+"|"+(e.w<0)+"|"+e.plain;
    const g=grp.get(k)||{pole:e.pole,neg:e.w<0,plain:e.plain,n:0,w:0};g.n++;g.w+=Math.abs(e.w);grp.set(k,g);}
  const items=[...grp.values()].sort((a,b)=>b.w-a.w);
  if(items.length) h+=`<h3>${esc(LEX.onfile_title)}</h3><ul class="onfile">`+
    items.map(g=>`<li class="${g.neg?"neg":""}" style="--dot:${dotCol(g.pole)}">${esc(cap1(g.plain))}${g.n>1?` <span class="dim">\u00d7${g.n}</span>`:""}</li>`).join("")+
    `</ul><div class="note">${esc(LEX.dots_note)}</div>`;
  const st=rec?(rec.review_status==="audited"?LEX.status.audited:LEX.status.unreviewed):LEX.status.pending;
  h+=`<p class="note" style="margin-top:12px">${esc(st)}</p><button class="fullrec" id="goAdv">${esc(LEX.full_record)}</button>`;
  const P=document.getElementById("panel"); P.innerHTML=h; P.scrollTop=0;
  document.getElementById("goAdv").onclick=()=>setMode("advanced");
}
function simpleOverview(){
  const q=D.queue||{pending:[],done:[]}, d=q.done.length, t=d+q.pending.length;
  document.getElementById("panel").innerHTML=`<h2>${esc(LEX.ov.title)}</h2><p class="s-sent">${esc(LEX.ov.lede)}</p>
    <h3>Progress</h3><div class="note">${esc(fill(LEX.ov.progress,{d:String(d),t:String(t)}))}</div>
    <h3>How to read it</h3><ul class="plain">${LEX.ov.howto.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`;
}
function renderCards(){
  const el=document.getElementById("cardsview"), groups={};
  for(const iso of Object.keys(D.names||{})){const c=lean(iso).cell;(groups[c]=groups[c]||[]).push(iso)}
  const order=["pole_us","pole_prc","lean_us","lean_prc","lean_sov","contested","mixed","insufficient"];
  let h=`<input id="cardsearch" type="search" placeholder="${esc(LEX.search)}" aria-label="${esc(LEX.search)}"><p class="note">${esc(LEX.cards_intro)}</p>`;
  for(const k of order){
    const list=(groups[k]||[]).sort((a,b)=>nameOf(a).localeCompare(nameOf(b))); if(!list.length) continue;
    h+=`<div class="grp"><span class="sw" style="background:${swatch(VIEWS.lean.cats[k][1])}"></span>${esc(LEX.cell[k].legend)} <span>(${list.length})</span></div>`;
    h+=k==="insufficient"
      ?`<div class="chips grpbody">`+list.map(iso=>`<button data-iso="${esc(iso)}" data-name="${esc(nameOf(iso).toLowerCase())}">${esc(nameOf(iso))}</button>`).join("")+`</div>`
      :`<div class="cards grpbody">`+list.map(iso=>{const n=nameOf(iso);return `<div class="scard" role="button" tabindex="0" data-iso="${esc(iso)}" data-name="${esc(n.toLowerCase())}"><h4>${esc(n)}</h4><div class="s-sent">${esc(simpleSentences(iso,n).text)}</div></div>`}).join("")+`</div>`;
  }
  el.innerHTML=h;
  el.querySelectorAll("[data-iso]").forEach(c=>{c.onclick=()=>openCountry(c.dataset.iso);
    c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openCountry(c.dataset.iso)}}});
  document.getElementById("cardsearch").oninput=e=>{
    const q=e.target.value.trim().toLowerCase();
    el.querySelectorAll(".grpbody").forEach(b=>{let n=0;
      b.querySelectorAll("[data-iso]").forEach(c=>{const on=!q||c.dataset.name.includes(q);c.style.display=on?"":"none";if(on)n++});
      b.style.display=n?"":"none"; b.previousElementSibling.style.display=n?"":"none";});
  };
}
function openCountry(iso){
  setView("lean");
  const f=GEO&&GEO.features.find(x=>isoOf(x)===iso);
  select(iso,f);
  if(window.innerWidth<=820) document.getElementById("panel").scrollIntoView({behavior:"smooth",block:"start"});
}
function setMode(m){
  uiMode=m;
  document.querySelectorAll("#modeToggle button").forEach(b=>b.classList.toggle("active",b.dataset.mode===m));
  buildNav(); if(view==="cards") renderCards(); else recolor();
  if(selected){const f=GEO&&GEO.features.find(x=>isoOf(x)===selected); select(selected,f);} else overview();
  try{localStorage.setItem("sd_showcase_mode",m)}catch(e){}
}
document.querySelectorAll("#modeToggle button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
try{const s=localStorage.getItem("sd_showcase_mode");if(s==="advanced"||s==="simple")uiMode=s;}catch(e){}
document.querySelectorAll("#modeToggle button").forEach(b=>b.classList.toggle("active",b.dataset.mode===uiMode));

/* ---------------- load ---------------- */
async function getJSON(u){const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error(u+" "+r.status);return r.json()}
(async function(){
  const st=document.getElementById("status");
  const entries=await Promise.allSettled(Object.entries(FILES).map(async([k,u])=>[k,await getJSON(u)]));
  const missing=[];
  entries.forEach((e,i)=>{if(e.status==="fulfilled")D[e.value[0]]=e.value[1];else missing.push(Object.keys(FILES)[i])});
  const done=(D.queue&&D.queue.done)||[];
  const recs=await Promise.allSettled(done.map(iso=>getJSON("countries/"+iso+".json")));
  recs.forEach(r=>{if(r.status==="fulfilled"&&r.value&&r.value.iso3)REC.set(r.value.iso3,r.value)});
  try{GEO=await getJSON(GEO_URL)}catch(e){st.textContent="could not load world map geometry";return}
  buildNav(); drawMap(); overview();
  st.textContent=`${REC.size} desk-pass records · layers: ${Object.keys(FILES).filter(k=>D[k]).length}/${Object.keys(FILES).length}`+(missing.length?` · missing: ${missing.join(", ")}`:"");
  document.getElementById("stamp").textContent="spec 0.2 · lean rule v0.2 · plain-language lexicon v"+LEX.version+" · generated in browser "+new Date().toISOString().slice(0,10);
  window.addEventListener("resize",()=>{clearTimeout(window._rz);window._rz=setTimeout(drawMap,150)});
})();
</script>
