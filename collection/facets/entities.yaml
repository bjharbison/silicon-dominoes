# Silicon Dominoes — facet lists (system prompt §3.2)
# Version: 1.0 · 2026-08-16
#
# Used by the deterministic prefilter in collection/extract.py and by GDELT
# Boolean query construction. Synonyms live HERE, never hard-coded inline
# (system prompt §3.2). Any edit bumps the version below.
#
# Prefilter rule: a capture proceeds to LLM extraction only if it matches
# >=1 geo term AND >=1 entity term.
#
# TWO STANDING EXCLUSIONS (v1.1), both measured, both easy to re-break:
#
# 1. No term may appear in BOTH `geo` and `actors`/`operators`. Such a term
#    satisfies both sides of the AND gate alone, degrading it to OR.
#
# 2. Ministry names are NOT on the entity watchlist, despite system prompt
#    §3.1 mandating a per-country ministry watch. A ministry's own outlet
#    prints its name in every article, so on that feed the name carries zero
#    discriminating power. Measured on rss-mic-vn 2026-08-16: adding
#    "Bộ Khoa học và Công nghệ" took passes 3 -> 17, but 11 of the 17 matched
#    the ministry and nothing else — masthead, not signal. Note the term is
#    selective only by orthographic accident: the abbreviations "Bộ KH&CN" (7
#    captures) and "BKHCN" (6) are NOT matched, and adding them as synonyms
#    would collapse the gate for this feed. Ministries are tracked via the
#    §3.1 watchlist monitors, not via this prefilter. Instrument terms are NOT part of the
# gate — they are too generic and would admit most trade press — but they
# are recorded here for GDELT query construction.

version: "1.1"

# ---------------------------------------------------------------- geography --
