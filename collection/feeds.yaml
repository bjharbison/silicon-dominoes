# Silicon Dominoes — pilot feed set (Southeast Asia)
# Synced into the `feeds` table by every collector run (feeds is a mutable
# config table by design). Editing this file + rerunning a poller is how
# feeds are added, retired, or corrected.
#
# HONESTY NOTE: entries marked `unverified: true` are best-guess URLs that
# could not be network-verified when this file was written. That is fine:
# the feed-health monitor exists precisely to flag dead feeds on day one,
# and replacing a URL here is the fix. Expect to tune this file during the
# first week of operation.

pilot_scope:
  region: southeast_asia
  countries: [IDN, VNM, THA, MYS, PHL, SGP, KHM, LAO, MMR]

feeds:
  # ---- regional trade / technical press (S2-class sources) ----------------
