# ---- verify-at-every-run items (system prompt §1, §4) ---------------------
# Membership status of WAICO and Pax Silica must show a successful
# verification within the last cycle; a missed verification is itself an
# alert (staleness rule in feed_health). Each fetch is archived as a capture;
# a content change fires an immediate ntfy notification.
# TODO: replace placeholder URLs with the canonical membership pages once
# identified — until then these will alert as failing, which is correct.
verify_items:
  - feed_id: verify-waico
    url: https://REPLACE-ME.example/waico-membership
    label: WAICO founding membership page
    max_gap_days: 8

  - feed_id: verify-pax-silica
    url: https://REPLACE-ME.example/pax-silica-members
    label: Pax Silica membership and fund status
    max_gap_days: 8
